hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }

# Plugins defined by this project
myschoolproject-application = { id = "myschoolproject.application" }
myschoolproject-feat-presentation = { id = "myschoolproject.feat.presentation" }
myschoolproject-feature = { id = "myschoolproject.feature" }
myschoolproject-library = { id = "myschoolproject.library" }
myschoolproject-hilt = { id = "myschoolproject.hilt" }
myschoolproject-room = { id = "myschoolproject.room" }